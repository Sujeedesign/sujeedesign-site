name: CI site et admin

on:
  push:
    paths:
      - "app/**"
      - "web/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/grapesjs-editor.yml"
  pull_request:
    paths:
      - "app/**"
      - "web/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/grapesjs-editor.yml"

permissions:
  contents: read

jobs:
  back-office:
    name: Tests back office
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run Python tests
        run: python -m pytest -q -m "not e2e"

  vitrine:
    name: Tests vitrine et éditeur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run web tests
        run: npm test
