<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Flux irisés, Solutions IA &amp; Automations</title>
  <desc>Texture abstraite pleine largeur, inspirée de reflets d'huile sur fond noir.</desc>
  <defs>
    <radialGradient id="sage" cx="45%" cy="35%" r="66%"><stop stop-color="#a0e0ab" stop-opacity=".87"/><stop offset=".3" stop-color="#759779" stop-opacity=".58"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="62%"><stop stop-color="#ffac2e" stop-opacity=".93"/><stop offset=".33" stop-color="#b66f2c" stop-opacity=".58"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="wine" cx="50%" cy="50%" r="64%"><stop stop-color="#a52d25" stop-opacity=".92"/><stop offset=".35" stop-color="#702820" stop-opacity=".58"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="liquid" x="-20%" y="-25%" width="140%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".004 .009" numOctaves="2" seed="50" result="flow"/><feDisplacementMap in="SourceGraphic" in2="flow" scale="175" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="60"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="shade"><stop offset=".2" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#050505"/>
  <g filter="url(#liquid)">
    <path d="M-220 920C-70 600 150 90 550 110s520 360 370 590-520 450-760 460-500 80-380-240Z" fill="url(#sage)"/>
    <path d="M480-160c410 80 600 300 490 620S650 970 470 750 220 370 340 100s-60-310 140-260Z" fill="url(#amber)"/>
    <path d="M1190 80c430-170 810 130 780 480s-360 590-680 450-390-340-270-570 40-300 170-360Z" fill="url(#wine)"/>
  </g>
  <rect width="1920" height="1080" fill="url(#shade)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".075" style="mix-blend-mode:soft-light"/>
</svg>
