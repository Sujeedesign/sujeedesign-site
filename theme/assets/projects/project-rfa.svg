<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Système irisé, Resto Franchise Africain</title>
  <desc>Texture abstraite pleine largeur dans des tons de sauge, d'ambre et d'oxblood.</desc>
  <defs>
    <radialGradient id="sage" cx="42%" cy="38%" r="66%"><stop stop-color="#a0e0ab" stop-opacity=".84"/><stop offset=".3" stop-color="#759779" stop-opacity=".56"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="62%"><stop stop-color="#ffac2e" stop-opacity=".94"/><stop offset=".35" stop-color="#b66f2c" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="wine" cx="50%" cy="50%" r="64%"><stop stop-color="#a52d25" stop-opacity=".92"/><stop offset=".38" stop-color="#702820" stop-opacity=".58"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="liquid" x="-20%" y="-25%" width="140%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".004 .009" numOctaves="2" seed="24" result="flow"/><feDisplacementMap in="SourceGraphic" in2="flow" scale="165" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="34"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="shade"><stop offset=".2" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#050505"/>
  <g filter="url(#liquid)">
    <path d="M-180 160C170-60 530 140 620 420s-60 510-360 660-620-40-520-430S-430 320-180 160Z" fill="url(#sage)"/>
    <path d="M360 980c-90-340 40-620 380-690s600 120 570 410-280 500-520 480-360 80-430-200Z" fill="url(#amber)"/>
    <path d="M1240-80c360 30 760 250 690 570s-350 530-650 390-440-280-330-530 80-450 290-430Z" fill="url(#wine)"/>
  </g>
  <rect width="1920" height="1080" fill="url(#shade)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".075" style="mix-blend-mode:soft-light"/>
</svg>
