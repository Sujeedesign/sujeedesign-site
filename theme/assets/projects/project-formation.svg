<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Voile de lumière, Formation UI/UX &amp; PAO</title>
  <desc>Texture abstraite pleine largeur, aux tons de sauge, d'ambre et d'oxblood.</desc>
  <defs>
    <radialGradient id="sage" cx="40%" cy="48%" r="65%"><stop stop-color="#a0e0ab" stop-opacity=".9"/><stop offset=".3" stop-color="#759779" stop-opacity=".58"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber" cx="50%" cy="50%" r="62%"><stop stop-color="#ffac2e" stop-opacity=".9"/><stop offset=".34" stop-color="#b66f2c" stop-opacity=".56"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="wine" cx="50%" cy="50%" r="64%"><stop stop-color="#a52d25" stop-opacity=".9"/><stop offset=".37" stop-color="#702820" stop-opacity=".58"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="liquid" x="-20%" y="-25%" width="140%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".004 .009" numOctaves="2" seed="37" result="flow"/><feDisplacementMap in="SourceGraphic" in2="flow" scale="155" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="47"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="shade"><stop offset=".2" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="#050505"/>
  <g filter="url(#liquid)">
    <path d="M-260 420C30 20 400 10 660 260s230 430 20 620-510 280-800 110-290-350-140-570Z" fill="url(#sage)"/>
    <path d="M520 110c260-190 670 10 700 330s-200 570-490 500-420-260-350-480 20-280 140-350Z" fill="url(#amber)"/>
    <path d="M1320 180c300-220 690-50 700 270s-240 610-560 540-400-260-310-470 10-270 170-340Z" fill="url(#wine)"/>
  </g>
  <rect width="1920" height="1080" fill="url(#shade)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".075" style="mix-blend-mode:soft-light"/>
</svg>
