<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="sjd-csrf" content="{{ csrf }}">
  <title>Éditeur visuel · {{ page.title or 'Page' }}</title>
  <link rel="stylesheet" href="/assets/editor/visual/visual-editor.css">
</head>
<body>
<div class="visual-app">
  <header class="visual-topbar">
    <a class="visual-back" href="/admin/pages">← Pages</a>
    <div class="visual-heading"><strong>{{ page.title or page.slug }}</strong><span>Éditeur visuel · {{ page.status }}</span></div>
    <div class="visual-actions">
      <span id="visual-status" role="status" aria-live="polite">Prêt</span>
      <button id="visual-save" type="button">Enregistrer</button>
      <button id="visual-rebase" type="button" hidden>Recharger le contenu</button>
      <button id="visual-publish" type="button" class="primary">Publier</button>
    </div>
  </header>
  <main class="visual-layout">
    <aside id="visual-blocks" aria-label="Sections disponibles">
      <h1>Sections</h1>
    </aside>
    <section id="visual-canvas" aria-label="Aperçu de la page"></section>
    <aside id="visual-traits" aria-label="Options de section"><h1>Options de section</h1></aside>
  </main>
</div>
<script id="visual-config" type="application/json">{{ config_json|safe }}</script>
<script type="module" src="/assets/editor/visual/visual-editor.js"></script>
</body>
</html>
