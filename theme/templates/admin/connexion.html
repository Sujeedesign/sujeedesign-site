<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Connexion — Back office Sujee Design</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="admin admin--login">
<main class="login-card">
  <img class="login-logo" src="/assets/logo-sujeepan-sabesan.svg" alt="Sujee Design" width="170" height="36">
  <h1>Back office</h1>
  <p class="login-intro">Espace de gestion du site sujeedesign.com.</p>
  {% if erreur %}<p class="admin-error" role="alert">{{ erreur }}</p>{% endif %}
  <form method="post" action="/admin/connexion" class="login-form">
    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    </div>
    {% if totp %}
    <div class="field">
      <label for="code">Code de vérification (6 chiffres)</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}">
    </div>
    {% endif %}
    <button class="btn btn--primary" type="submit">Se connecter</button>
  </form>
  <p class="login-note">Accès réservé. Les tentatives sont limitées et journalisées.</p>
</main>
</body>
</html>
