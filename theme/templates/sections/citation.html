{% set d = s.data %}
{% if d.get('quote') %}
<section class="citation reveal">
  <div class="container">
    <blockquote class="quote">
      <p class="quote-text">{{ d.get('quote')|rich }}</p>
      {% if d.get('author') or d.get('role') %}
      <footer class="quote-source">
        {% if d.get('author') %}<cite>{{ d.get('author') }}</cite>{% endif %}
        {% if d.get('role') %}<span class="quote-role">{{ d.get('role') }}</span>{% endif %}
      </footer>
      {% endif %}
    </blockquote>
  </div>
</section>
{% endif %}
