{% set d = s.data %}
{% if d.get('quote') %}
<section class="citation reveal">
  <div class="container">
    <blockquote class="quote">
      <p class="quote-text" data-field="quote">{{ (d.get('quote') or '')|rich }}</p>
      <footer class="quote-source">
        <cite data-field="author">{{ d.get('author') or '' }}</cite>
        <span class="quote-role" data-field="role">{{ d.get('role') or '' }}</span>
      </footer>
    </blockquote>
  </div>
</section>
{% endif %}
