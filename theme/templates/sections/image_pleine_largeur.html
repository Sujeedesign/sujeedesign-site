{% set d = s.data %}
<section class="page-body reveal">
  <figure class="full-bleed" data-field="src">
    {% if d.get('src') %}<img src="{{ d.get('src') }}" alt="{{ d.get('alt','') }}" loading="lazy" decoding="async">{% endif %}
    <figcaption data-field="caption">{{ d.get('caption') or '' }}</figcaption>
  </figure>
</section>
