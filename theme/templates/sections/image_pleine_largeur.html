{% set d = s.data %}
{% if d.get('src') %}
<section class="page-body reveal">
  <figure class="full-bleed">
    <img src="{{ d.get('src') }}" alt="{{ d.get('alt','') }}" loading="lazy" decoding="async">
    <figcaption data-field="caption">{{ d.get('caption') or '' }}</figcaption>
  </figure>
</section>
{% endif %}
