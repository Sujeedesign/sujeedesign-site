{% set d = s.data %}
{% if d.get('src') %}
{% set alt = d.get('alt') or d.get('caption') or 'Visuel du projet' %}
<section class="page-body reveal">
  <figure class="full-bleed">
    <img src="{{ d.get('src') }}" alt="{{ alt }}" loading="lazy" decoding="async">
    <figcaption data-field="caption">{{ d.get('caption') or '' }}</figcaption>
  </figure>
</section>
{% endif %}
