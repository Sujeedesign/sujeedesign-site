{% set d = s.data %}
{% set steps = d.get('steps', []) %}
<section class="process reveal">
  <div class="container">
    <p class="section-label reveal" data-field="label">{{ d.get('label') or '' }}</p>
    <h2 class="bloc-title" data-field="title">{{ (d.get('title') or '')|inline }}</h2>
    <ol class="process-grid">
      {% for step in steps %}
      <li class="process-step">
        <span class="step-idx">{{ '%02d' % loop.index }}</span>
        <h3 class="step-title">{{ step.get('title','') }}</h3>
        <p class="step-text">{{ step.get('text','') }}</p>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
