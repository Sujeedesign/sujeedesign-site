{% set d = s.data %}
{% set items = d.get('items', []) %}
{% if items %}
<div class="v2-marquee-wrap">
  <div class="v2-marquee" aria-hidden="true">
    <div class="v2-marquee__track">
      {% for _ in range(4) %}{% for item in items %}<span class="v2-marquee__item">{{ item }}<span class="v2-marquee__dot"></span></span>{% endfor %}{% endfor %}
    </div>
    <div class="v2-marquee__track v2-marquee__track--outline">
      {% for _ in range(4) %}{% for item in items %}<span class="v2-marquee__item">{{ item }}<span class="v2-marquee__dot"></span></span>{% endfor %}{% endfor %}
    </div>
  </div>
</div>
{% endif %}
