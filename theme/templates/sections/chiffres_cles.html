{% set d = s.data %}
{% set items = d.get('items', []) %}
{% if items %}
<section class="stats reveal">
  <div class="container">
    <p class="section-label reveal" data-field="label">{{ d.get('label') or '' }}</p>
    <h2 class="stats-title" data-field="title">{{ (d.get('title') or '')|inline }}</h2>
    <dl class="stats-grid">
      {% for item in items %}
      <div class="stat">
        <dt class="stat-label">{{ item.get('label','') }}</dt>
        <dd class="stat-value">{{ item.get('value','') }}</dd>
      </div>
      {% endfor %}
    </dl>
  </div>
</section>
{% endif %}
