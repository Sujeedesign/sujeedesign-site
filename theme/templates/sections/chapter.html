{% set d = s.data %}
<section class="s-chap reveal{% if d.get('dark') %} dark{% endif %}">
  <div class="container">
    <div class="chap">
      <div class="chap-head">
        <span class="type" data-field="kicker">{{ d.get('kicker') or '' }}</span>
        <h2 class="chap-title" data-field="title">{{ (d.get('title') or '')|inline }}</h2>
      </div>
      <div class="chap-body" data-field="body">
        {{ d.get('body','')|rich }}
        {% set items = d.get('list', []) %}
        {% if items %}
        <ul class="chap-list">
          {% for item in items %}<li>{{ item }}</li>{% endfor %}
        </ul>
        {% endif %}
      </div>
    </div>
  </div>
</section>
