{% set d = s.data %}
{% set items = d.get('items', []) %}
<section class="faq reveal">
  <div class="container">
    <p class="section-label reveal" data-field="label">{{ d.get('label') or '' }}</p>
    <h2 class="bloc-title" data-field="title">{{ (d.get('title') or '')|inline }}</h2>
    <div class="faq-list">
      {% for item in items %}
      <details class="faq-item">
        <summary class="faq-question">{{ item.get('q','') }}</summary>
        <div class="faq-answer">{{ item.get('a','')|rich }}</div>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
