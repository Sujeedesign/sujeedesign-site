{% from "partials/macros.html" import heading_lines %}
{% set d = s.data %}
<section id="manifeste">
  <div class="container">
    <p class="section-label reveal" data-field="label">{{ d.get('label') or '' }}</p>
    {{ heading_lines(d.get('heading_lines', []), 'manifeste-heading reveal') }}
    <p class="manifeste-text" id="manifesteText" data-field="text">{{ d.get('text') or '' }}</p>
  </div>
</section>
