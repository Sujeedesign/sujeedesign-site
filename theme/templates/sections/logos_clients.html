{% set d = s.data %}
{% set logos = d.get('logos', []) %}
<section class="logos reveal">
  <div class="container">
    <p class="section-label reveal" data-field="label">{{ d.get('label') or '' }}</p>
    <ul class="logos-grid">
      {% for logo in logos %}
      <li class="logo-item"><img src="{{ logo.get('src','') }}" alt="{{ logo.get('alt','') }}" loading="lazy" decoding="async"></li>
      {% endfor %}
    </ul>
  </div>
</section>
