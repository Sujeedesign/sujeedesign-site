<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Éditeur visuel, pilote</title>
  </head>
  <body>
    <div class="visual-app">
      <header class="visual-topbar">
        <strong>Éditeur visuel</strong>
        <span>Prototype GrapesJS Core</span>
      </header>
      <main class="visual-layout">
        <aside id="visual-blocks" aria-label="Sections disponibles">
          <h1>Sections</h1>
        </aside>
        <section id="visual-canvas" aria-label="Aperçu de la page"></section>
        <aside id="visual-traits" aria-label="Options de section">
          <h1>Options</h1>
        </aside>
        <div id="visual-styles" hidden></div>
      </main>
    </div>
    <script>
      window.sjdVisualEditorConfig = { themeStyles: ['/src/demo-theme.css'] };
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
